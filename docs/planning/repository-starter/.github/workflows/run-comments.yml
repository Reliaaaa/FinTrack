name: Run comments
on:
  workflow_run:
    workflows: [Planning validation, Android CI, Backend CI, Deploy staging, Deploy production]
    types: [in_progress, completed]
permissions: {}
concurrency:
  group: run-comment-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
      contents: write # GitHub commit comments require contents:write; no checkout or code execution.
    steps:
      - name: Comment using trusted event metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, re, urllib.request, urllib.error
          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)
          run = event['workflow_run']
          owner, repo = os.environ['GITHUB_REPOSITORY'].split('/')
          base = os.environ['GITHUB_API_URL'] + '/repos/' + owner + '/' + repo
          allowed = {'Planning validation':'planning', 'Android CI':'android-debug',
                     'Backend CI':'backend-test', 'Deploy staging':'staging',
                     'Deploy production':'production'}
          if run['name'] not in allowed:
              raise RuntimeError('Unexpected workflow name')
          sha = run['head_sha']
          if not re.fullmatch(r'[0-9a-fA-F]{40,64}', sha):
              raise RuntimeError('Invalid commit SHA')
          def request(path, method='GET', data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(base + path, data=payload, method=method,
                  headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def pages(path):
              page = 1
              while True:
                  data = request(path + ('&' if '?' in path else '?') + 'per_page=100&page=' + str(page))
                  yield from data
                  if len(data) < 100:
                      break
                  page += 1
          stage = event['action']
          attempt = run.get('run_attempt', 1)
          marker = '<!-- fintrack-run:%s:%s:%s -->' % (run['id'], attempt, stage)
          state = run.get('conclusion') if stage == 'completed' else 'in_progress'
          state = state or 'unknown'
          run_url = os.environ['GITHUB_SERVER_URL'] + '/' + owner + '/' + repo + '/actions/runs/' + str(run['id'])
          body = (marker + '\n**FinTrack — ' + run['name'] + '**\n\n'
                  + '- Status: `' + state + '`\n'
                  + '- Target: `' + allowed[run['name']] + '`\n'
                  + '- Commit: `' + sha + '`\n'
                  + '- Run / attempt: `' + str(run['id']) + ' / ' + str(attempt) + '`\n'
                  + '- [Detail, hasil tes, dan artefak](' + run_url + ')\n')
          if run['name'] == 'Planning validation':
              body += '\nValidasi dokumen saja; belum build APK atau deploy aplikasi.\n'
          elif stage == 'completed':
              body += '\nStatus ini adalah hasil workflow; bukti health check/rilis ada pada ringkasan run.\n'
          prs = sorted({p['number'] for p in run.get('pull_requests', [])
                        if p.get('base', {}).get('repo', {}).get('id') == event['repository']['id']})
          if not prs:
              associated = request('/commits/' + sha + '/pulls')
              prs = sorted({p['number'] for p in associated
                            if p.get('base', {}).get('repo', {}).get('id') == event['repository']['id']})
          def already_posted(items):
              return any(marker in (item.get('body') or '')
                         and item.get('user', {}).get('login') == 'github-actions[bot]' for item in items)
          if prs:
              for number in prs:
                  path = '/issues/' + str(number) + '/comments'
                  if not already_posted(pages(path)):
                      request(path, 'POST', {'body': body})
          else:
              path = '/commits/' + sha + '/comments'
              if not already_posted(pages(path)):
                  request(path, 'POST', {'body': body})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(body)
